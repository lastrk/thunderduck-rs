apiVersion: workflows.dev/v1alpha1
kind: Workflow
metadata:
  namespace: pipelines
spec:
  owner:
    name: "Batch Compute Team"
    contact: "#batch-compute-team"
  events:
    - push
  branches:
    - "*"
    - "!$(workflow.repo.default-branch)"
  tasks:
    check:
      resources:
        cpu: 4
        memory: 6Gi
      steps:
        - uses: checkout

        # restore-cache has no --folder flag: it just untars whatever save-cache
        # previously packed into $HOME and the repo's working dir (both shared
        # across every step in this task, per Checkout).
        - name: restore-cache
          image: 193814090748.dkr.ecr.us-east-1.amazonaws.com/cicd/cache
          run: |
            restore-cache \
              --cache-key-template='thunderduck-rs-cargo-{% checksum Cargo.lock %}' \
              --cache-key-default='thunderduck-rs-cargo'

        # Must match the release Dockerfile's builder image, so a PR cannot
        # go green on a different compiler than the one that ships the artifact.
        - name: fmt-clippy-test
          image: rust:1.97.1-bookworm
          run: |
            export CARGO_HOME="$HOME/.cargo-cache"
            export PATH="$CARGO_HOME/bin:$PATH"
            apt-get update
            apt-get install -y --no-install-recommends unzip
            rustup component add rustfmt clippy
            scripts/dev/duckdb-build-cache.sh ensure
            duckdb_dir="$(scripts/dev/duckdb-build-cache.sh dir)"
            export DUCKDB_LIB_DIR="$duckdb_dir/lib"
            export DUCKDB_INCLUDE_DIR="$duckdb_dir/include"
            export DUCKDB_STATIC=1
            cargo fmt --all -- --check
            # `--locked` keeps CI on the committed Cargo.lock. Without it a
            # checkout re-resolves the graph and can pull a dependency whose
            # MSRV exceeds this image's rustc — how this workflow broke on
            # 2026-08-07 (ar_archive_writer 0.5.3 requires rustc 1.88).
            cargo clippy --locked --workspace --all-targets -- -D warnings
            cargo test --locked --workspace

        - name: save-cache
          image: 193814090748.dkr.ecr.us-east-1.amazonaws.com/cicd/cache
          run: |
            save-cache \
              --cache-key-template='thunderduck-rs-cargo-{% checksum Cargo.lock %}' \
              --folder=~/.cargo-cache \
              --folder=.build-cache \
              --folder=target
