apiVersion: workflows.dev/v1alpha1
kind: Workflow
metadata:
  namespace: pipelines
spec:
  owner:
    name: "Batch Compute Team"
    contact: "#batch-compute-team"
  events:
    - push
  branches:
    - "*"
    - "!$(workflow.repo.default-branch)"
  tasks:
    check:
      resources:
        cpu: 2
        memory: 4Gi
      steps:
        - uses: checkout
        # Must match the release Dockerfile's builder image, so a PR cannot
        # go green on a different compiler than the one that ships the artifact.
        - name: fmt-clippy-test
          image: rust:1.97.1-bookworm
          run: |
            rustup component add rustfmt clippy
            cargo fmt --all -- --check
            # `--locked` keeps CI on the committed Cargo.lock. Without it a
            # checkout re-resolves the graph and can pull a dependency whose
            # MSRV exceeds this image's rustc — how this workflow broke on
            # 2026-08-07 (ar_archive_writer 0.5.3 requires rustc 1.88).
            cargo clippy --locked --workspace --all-targets --features bundled -- -D warnings
            cargo test --locked --workspace --features bundled
