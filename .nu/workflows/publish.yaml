apiVersion: workflows.dev/v1alpha1
kind: Workflow
metadata:
  namespace: pipelines
spec:
  owner:
    name: "Batch Compute Team"
    contact: "#batch-compute-team"
  events:
    - push
  branches:
    - "$(workflow.repo.default-branch)"
    # TEMP validation trigger for ci/publish-cross-compile-cache — remove
    # before merging to main.
    - "ci/publish-cross-compile-cache"
  tasks:
    build-and-publish:
      serviceAccount: ecr-write
      resources:
        cpu: 4
        memory: 8Gi
      steps:
        - uses: checkout

        # restore-cache has no --folder flag: it just untars whatever save-cache
        # previously packed into $HOME and the repo's working dir (both shared
        # across every step in this task, per Checkout).
        # Namespaced separately from pr.yaml's cache key: this task's target/
        # layout is per-triple (target/<triple>/release, always built with
        # --target) rather than pr.yaml's plain target/release, so sharing a
        # key would just have each workflow overwrite the other's blob.
        - name: restore-cache
          image: 193814090748.dkr.ecr.us-east-1.amazonaws.com/cicd/cache
          run: |
            restore-cache \
              --cache-key-template='thunderduck-rs-cargo-publish-{% checksum Cargo.lock %}' \
              --cache-key-default='thunderduck-rs-cargo-publish'

        # Cross-compiles both targets natively on this (amd64) node — no QEMU.
        # aarch64-unknown-linux-gnu uses the gcc-aarch64-linux-gnu cross linker;
        # DuckDB's C++ (the `bundled` feature) cross-compiles the same way cargo
        # cross-compiles the Rust crates. This used to happen inside the release
        # Dockerfile's `cargo build`, once per platform, on a fresh BuildKit
        # builder with no cache — that's what made build-and-publish time out at
        # the platform's 2h ceiling. Doing it here instead means it benefits from
        # the same cicd/cache restore/save-cache pattern already proven in
        # pr.yaml's `check` task.
        - name: build-release-binaries
          image: rust:1.97.1-bookworm
          run: |
            export CARGO_HOME="$HOME/.cargo-cache"
            export PATH="$CARGO_HOME/bin:$PATH"
            apt-get update
            apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            cargo build --locked --release --features bundled --target x86_64-unknown-linux-gnu -p thunderduck-connect-server
            cargo build --locked --release --features bundled --target aarch64-unknown-linux-gnu -p thunderduck-connect-server
            mkdir -p dist
            cp target/x86_64-unknown-linux-gnu/release/thunderduck-connect-server dist/thunderduck-connect-server-linux-amd64
            cp target/aarch64-unknown-linux-gnu/release/thunderduck-connect-server dist/thunderduck-connect-server-linux-arm64

        - name: save-cache
          image: 193814090748.dkr.ecr.us-east-1.amazonaws.com/cicd/cache
          run: |
            save-cache \
              --cache-key-template='thunderduck-rs-cargo-publish-{% checksum Cargo.lock %}' \
              --folder=~/.cargo-cache \
              --folder=target

        # Packages the two prebuilt binaries (Dockerfile does no compiling —
        # just a COPY keyed on TARGETARCH), so this is cheap per platform.
        - uses: buildkit
          name: build-push-thunderduck-rs-image
          options:
            ecrLogin: true
            destination:
              # TEMP validation tag — restore to $(workflow.head-commit) /
              # :latest before merging to main.
              - 193814090748.dkr.ecr.us-east-1.amazonaws.com/di-art/thunderduck-rs:validate-cross-compile
            platform:
              - linux/amd64
              - linux/arm64
