[package]
name = "thunderduck-connect-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "thunderduck-connect-server"
path = "src/main.rs"

[features]
# Compile DuckDB from source; off by default (local dev links a shared prebuilt
# libduckdb — see scripts/dev/). CI / fresh clones: `cargo build --features bundled`.
bundled = ["thunderduck-core/bundled"]

[dependencies]
thunderduck-core = { path = "../core" }
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
arrow-ipc.workspace = true
arrow.workspace = true
clap.workspace = true
uuid.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
