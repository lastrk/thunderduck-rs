[package]
name = "thunderduck-core"
version.workspace = true
edition.workspace = true

[features]
# Compile DuckDB from source (the upstream `bundled` behavior). Off by default:
# local dev links a shared prebuilt libduckdb via DUCKDB_LIB_DIR (see scripts/dev/).
# CI / fresh clones: `cargo build --features bundled`.
bundled = ["duckdb/bundled"]

[dependencies]
thiserror.workspace = true
duckdb.workspace    = true
dashmap.workspace   = true
tokio.workspace     = true
sqlparser.workspace = true
regex.workspace     = true
tracing.workspace   = true
