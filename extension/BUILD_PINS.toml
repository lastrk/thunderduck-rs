# extension/BUILD_PINS.toml
#
# Single source of truth for the extension's build-time version pins.
# scripts/dev/build-extension.sh reads this file (not the other way around)
# to assert the three-way lock before building:
#
#   extension/duckdb submodule checked-out tag
#     == [duckdb].version below
#     == the DuckDB version encoded in the `duckdb` crate version pin in the
#        workspace Cargo.toml (see docs/context/gotchas.md #6 and
#        docs/context/dependencies.md → Version Pinning)
#
# This file is also the input read by .github/workflows/extension-release.yml
# to pick the single DuckDB version the release matrix builds against — see
# amendment A1/A2: local dev builds and the CI release matrix both build for
# exactly ONE DuckDB version, never a multiversion matrix.

[duckdb]
version = "v1.5.4"
sha = "08e34c447bae34eaee3723cac61f2878b6bdf787"

[extension_ci_tools]
# Canonical duckdb/extension-ci-tools, pinned by SHA — this is what the
# `extension-ci-tools` submodule under extension/ is checked out at.
sha = "16d89a59ee14904a62383e83c300432b19d29abc"
# The lastrk fork appears ONLY as the release workflow's
# `override_ci_tools_repository` input for the manylinux build legs — a
# single commit on top of a v1.5.x extension-ci-tools tag that disables
# EPEL 8 in the manylinux_2_28 Dockerfiles. Tracked upstream as
# duckdb/extension-ci-tools#374 / PR #375: once that lands and is backported
# to a v1.5.x tag, drop `ci_override` and `override_ci_tools_repository` from
# the workflow, and point the submodule pin above at the new tag.
ci_override = "lastrk/extension-ci-tools@bebb406d50413c4f4a55a44d9316a69b9d1a0018"

[provenance]
# Both archived post-migration; see extension/README.md PROVENANCE section
# and docs/context/extension-archival-checklist.md for the full record.
source_repo = "nubank/thunderduck-duckdb-extension"
source_mirror = "lastrk/thunderduck-duckdb-extension"
imported_at = "33e8d49"

# The origin and the mirror have DIVERGENT history: imported_at (33e8d49, origin
# main) is NOT an ancestor of the mirror's main (a175a6b). Three commits existed
# only on the MIRROR and were ported in separately, on top of the import:
#   50874da (2026-04-02) aggregate-state alignment fix + HugeintToInt128 signed-shift UB fix
#   97940a9 (2026-04-05) spark_skewness rewritten on Pebay's online algorithm (+ skewness.test)
#   8fd5498 (2026-04-02) test/sql/window_aggregates.test
# Anything comparing extension/ against a single upstream checkout must diff
# BOTH remotes — see docs/context/extension-archival-checklist.md gate 1.
ported_from_mirror = ["50874da", "97940a9", "8fd5498"]

# Changes made in-tree AFTER the mirror port, present in NEITHER upstream repo.
# These are the authoritative explanation for the remaining diff hunks when
# running the import-fidelity gate. See extension/README.md's Provenance section
# ("Fixed in-tree after the mirror port") for the full rationale.
#   - spark_try_aggregates.hpp: SparkTrySumDecimalState had the same raw-__int128
#     alignment defect; the mirror fix missed it (that file is not one of the
#     mirror port's 4 files).
#   - spark_aggregates.hpp: SPARK_ASSERT_STATE_ALIGNMENT static_assert for all 7
#     aggregate states; spark_skewness Finalize now uses sqrt((m2*m2)*m2) like
#     Spark instead of pow(m2, 1.5), and propagates NaN instead of throwing.
#   - test/sql/skewness.test revised; test/sql/decimal_state_alignment.test added.
fixed_in_tree_after_port = [
    "src/include/spark_aggregates.hpp",
    "src/include/spark_try_aggregates.hpp",
    "test/sql/skewness.test",
    "test/sql/decimal_state_alignment.test",
]

# Commit the checked-in extensions/vendored/ binaries were BUILT from. This is a
# thunderduck-rs commit (built in-tree by this repo's own CI), not an
# extension-repo commit; the authoritative record is
# extensions/vendored/MANIFEST.toml's [source].build_sha.
# STALE: predates the ported_from_mirror commits above -> re-vendor via
# .github/workflows/extension-release.yml before relying on these binaries.
vendored_binaries_built_at = "74e9413"
