[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Backstop only: the differential collect path self-bounds each engine at
# DIFFERENTIAL_TIMEOUT (default 10s), which fires first with a clean TimeoutError.
# This outer per-test timeout is a higher safety net for a non-collect hang.
# Server startup / session fixtures are excluded via timeout_func_only.
timeout = 30
# Apply per-test @pytest.mark.timeout to the test function only, NOT fixture setup.
# This prevents Spark JVM startup (60-120s) from triggering the 30s test timeout.
timeout_func_only = true
